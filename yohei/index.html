<!DOCTYPE html>

    <style>
        body {
            font-family: 'Inter', 'Shippori Mincho', serif;
            background-color: #fcfbf9;
            color: #4a4a4a;
        }
        .card-header-org {
            background-color: #5e6c4b;
        }
        .card-header-res {
            background-color: #b45309;
        }
        .glass-panel {
            background: rgba(255,255,255,0.95);
            border: 1px solid rgba(139,94,60,0.15);
            box-shadow: 0 4px 15px -1px rgba(139,94,60,0.05);
            backdrop-filter: blur(8px);
        }
        .font-jp {
            font-family: 'Shippori Mincho', serif;
        }
        .period-btn {
            transition: all 0.3s ease;
        }
        .period-btn.active {
            background-color: #57534e;
            color: white;
        }
        .period-btn:not(.active):hover {
            background-color: #e7e5e4;
            color: #57534e;
        }
        .store-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.08);
            border: 1px solid #f3f4f6;
        }
        .store-header {
            padding: 16px 20px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .plan-box {
            background: #fafaf9;
            border: 1px solid #e7e5e4;
            border-radius: 10px;
            padding: 16px;
        }
        .progress-wrap {
            width: 100%;
            height: 18px;
            background: #e7e5e4;
            border-radius: 9999px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            border-radius: 9999px;
            transition: width .5s ease;
        }
        .progress-green {
            background: linear-gradient(to right, #10b981, #34d399);
        }
        .progress-orange {
            background: linear-gradient(to right, #f59e0b, #fbbf24);
        }
        .progress-blue {
            background: linear-gradient(to right, #3b82f6, #60a5fa);
        }
        .chart-area {
            height: 180px;
        }
        .yoy-label {
            font-size: 14px;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 9999px;
            display: inline-block;
        }
        .yoy-up {
            background: #dcfce7;
            color: #166534;
        }
        .yoy-down {
            background: #fee2e2;
            color: #991b1b;
        }
        .period-display {
            background: #fff;
            border: 1px solid #e5e7eb;
        }
        .notice-text {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed #d6d3d1;
            color: #78716c;
            font-size: 12px;
            line-height: 1.8;
        }
        .rate-good {
            color: #16a34a !important;
        }
        .rate-bad {
            color: #dc2626 !important;
        }
    </style>
</head>

<script>
    Chart.defaults.font.family =
        "'Inter', 'Shippori Mincho', sans-serif";
    let currentPeriod = 'monthly';
    let storeChart = null;
    let trendChart = null;
    // 店舗合計売上保持用
    let currentTotalSales = 0;
    let currentTrendSales = 0;
    let currentTrendPlan = 0;
    let currentTrendTitle = '';
    const fmtDollar = num =>
        new Intl.NumberFormat('en-US', {
            style: 'currency',
            currency: 'USD',
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }).format(num);

    function randomRangeDecimal(min, max) {
        return Number(
             (Math.random() * (max - min) + min).toFixed(2)
        );
    }

    function getData(period) {
        const yearly = period === 'yearly';
        const cafeSales =
            yearly ? randomRangeDecimal(30000, 50000)
                   : randomRangeDecimal(300, 500);
        const rtbSales =
            yearly ? randomRangeDecimal(20000, 40000)
                   : randomRangeDecimal(200, 400);
        const partyPlan =
            yearly ? randomRangeDecimal(50000, 70000)
                   : randomRangeDecimal(500, 700);
        const partySales =
            Number(
                (partyPlan * (0.6 + Math.random() * 0.7))
                .toFixed(2)
            );
        const epiclePlan =
            yearly ? randomRangeDecimal(40000, 60000)
                   : randomRangeDecimal(400, 600);
        const epicleSales =
            Number(
                (epiclePlan * (0.6 + Math.random() * 0.7))
                .toFixed(2)
            );
        const otherSales =
            yearly ? randomRangeDecimal(10000, 20000)
                   : randomRangeDecimal(100, 200);
        const oteSales =
            Number(
                (
                    cafeSales +
                    rtbSales +
                    partySales +
                    epicleSales +
                    otherSales
                ).toFixed(2)
            );
        const otePlan =
            partyPlan + epiclePlan;
        const resPlan =
            yearly ? randomRangeDecimal(350000, 500000)
                   : randomRangeDecimal(3000, 4500);
        const resSales =
            Number(
                (resPlan * (0.6 + Math.random() * 0.7))
                .toFixed(2)
            );
        return {
            otemachi: {
                sales: oteSales,
                plan: otePlan,
                last: oteSales * (0.85 + Math.random() * 0.3),
                lastUpdate: '2026/08/11',
                breakdown: {
                    cafe: {
                        sales: cafeSales
                    },
                    rtb: {
                        sales: rtbSales
                    },
                    party: {
                        sales: partySales,
                        plan: partyPlan
                    },
                    epicle: {
                        sales: epicleSales,
                        plan: epiclePlan
                    },
                    other: {
                        sales: otherSales
                    }
                }
            },
            restaurant: {
                sales: resSales,
                plan: resPlan,
                last: resSales * (0.85 + Math.random() * 0.3),
                lastUpdate: '2026/08/10'
            }
        };
    }

    function renderYoYBadge(elId, current, last) {
        const ratio = (current / last) * 100;
        const className =
            ratio >= 100
                ? 'yoy-up'
                : 'yoy-down';
        const label =
            currentPeriod === 'monthly'
                ? '前年同月比'
                : '前年同期比';
        document.getElementById(elId).innerHTML = `
            <span class="yoy-label ${className}">
                ${label} ${ratio.toFixed(1)}%
            </span>
        `;
    }

    function updateProgress(id, rate) {
        document.getElementById(id).style.width =
            Math.min(rate, 100) + '%';
    }

    function updateRateColor(id, rate) {
        const el = document.getElementById(id);
        el.classList.remove(
            'rate-good',
            'rate-bad'
        );
        if (rate >= 100) {
            el.classList.add('rate-good');
        } else {
            el.classList.add('rate-bad');
        }
    }

function renderStoreChart(
    oteSales,
    resSales,
    otePlan,
    resPlan
) {
    const canvas =
        document.getElementById('storeChart');

    if (storeChart) {
        storeChart.destroy();
    }

    /*
     * ==========================================
     * 凡例をHTMLで作成
     * ==========================================
     */
    const chartArea =
        canvas.parentElement;

 const legend =
    document.getElementById(
        'storeChartLegend'
    );

legend.innerHTML = `

    <!-- 計画 -->
    <div
        style="
            display:flex;
            align-items:center;
            gap:5px;
        "
    >

        <div
            style="
                display:flex;
                flex-direction:column;
                gap:2px;
            "
        >

            <!-- 薄い緑 -->
            <span
                style="
                    display:block;
                    width:9px;
                    height:9px;
                    background:rgba(94,108,75,0.25);
                    border:1px solid #5e6c4b;
                "
            ></span>

            <!-- 薄いオレンジ -->
            <span
                style="
                    display:block;
                    width:9px;
                    height:9px;
                    background:rgba(217,119,6,0.25);
                    border:1px solid #d97706;
                "
            ></span>

        </div>

        <span>計画</span>

    </div>


    <!-- 実績 -->
    <div
        style="
            display:flex;
            align-items:center;
            gap:5px;
        "
    >

        <div
            style="
                display:flex;
                flex-direction:column;
                gap:2px;
            "
        >

            <!-- 濃い緑 -->
            <span
                style="
                    display:block;
                    width:9px;
                    height:9px;
                    background:#5e6c4b;
                "
            ></span>

            <!-- 濃いオレンジ -->
            <span
                style="
                    display:block;
                    width:9px;
                    height:9px;
                    background:#d97706;
                "
            ></span>

        </div>

        <span>実績</span>

    </div>

`;


    /*
     * ==========================================
     * データ
     * ==========================================
     */
    const plans = [
        otePlan,
        resPlan
    ];

    const sales = [
        oteSales,
        resSales
    ];

    const storeNames = [
        'Kahala',
        'Dillingham'
    ];


    /*
     * ==========================================
     * カスタムツールチップ
     * ==========================================
     */
    let tooltipEl =
        document.getElementById(
            'store-chart-tooltip'
        );

    if (!tooltipEl) {

        tooltipEl =
            document.createElement('div');

        tooltipEl.id =
            'store-chart-tooltip';

        tooltipEl.style.position =
            'fixed';

        tooltipEl.style.pointerEvents =
            'none';

        tooltipEl.style.background =
            'rgba(0,0,0,0.85)';

        tooltipEl.style.color =
            '#fff';

        tooltipEl.style.padding =
            '10px 14px';

        tooltipEl.style.borderRadius =
            '6px';

        tooltipEl.style.fontSize =
            '13px';

        tooltipEl.style.lineHeight =
            '1.7';

        tooltipEl.style.zIndex =
            '99999';

        tooltipEl.style.whiteSpace =
            'nowrap';

        tooltipEl.style.display =
            'none';

        document.body.appendChild(
            tooltipEl
        );
    }


    /*
     * ==========================================
     * 右端だけ角丸の棒を描画
     * ==========================================
     */
    function drawBar(
        ctx,
        x,
        y,
        width,
        height,
        color,
        radius = 8
    ) {

        if (width <= 0) {
            return;
        }

        radius =
            Math.min(
                radius,
                height / 2,
                width
            );

        ctx.beginPath();

        /*
         * 左上
         */
        ctx.moveTo(
            x,
            y
        );

        /*
         * 上辺
         */
        ctx.lineTo(
            x + width - radius,
            y
        );

        /*
         * 右上
         */
        ctx.quadraticCurveTo(
            x + width,
            y,
            x + width,
            y + radius
        );

        /*
         * 右辺
         */
        ctx.lineTo(
            x + width,
            y + height - radius
        );

        /*
         * 右下
         */
        ctx.quadraticCurveTo(
            x + width,
            y + height,
            x + width - radius,
            y + height
        );

        /*
         * 左下
         */
        ctx.lineTo(
            x,
            y + height
        );

        /*
         * 左端
         */
        ctx.closePath();

        ctx.fillStyle =
            color;

        ctx.fill();
    }


    /*
     * ==========================================
     * グラフ本体を描画するプラグイン
     * ==========================================
     */
    const overlapPlugin = {

        id: 'storeOverlapPlugin',

        afterDraw(chart) {

            const ctx =
                chart.ctx;

            const xScale =
                chart.scales.x;

            const yScale =
                chart.scales.y;


            /*
             * 棒の高さ
             */
            const barHeight = 18;


            /*
             * 50%程度重ねる
             */
            const offset = 4.5;


            storeNames.forEach(
                (storeName, index) => {

                    /*
                     * 店舗の中心位置
                     */
                    const centerY =
                        yScale.getPixelForValue(
                            index
                        );


                    /*
                     * 計画
                     */
                    const planY =
                        centerY -
                        offset;


                    /*
                     * 実績
                     */
                    const salesY =
                        centerY +
                        offset;


                    /*
                     * X座標
                     */
                    const zeroX =
                        xScale.getPixelForValue(
                            0
                        );

                    const planX =
                        xScale.getPixelForValue(
                            plans[index]
                        );

                    const salesX =
                        xScale.getPixelForValue(
                            sales[index]
                        );


                    /*
                     * =================================
                     * 計画
                     * =================================
                     */
                    drawBar(
                        ctx,

                        zeroX,

                        planY -
                        barHeight / 2,

                        planX -
                        zeroX,

                        barHeight,

                        index === 0
                            ? 'rgba(94,108,75,0.25)'
                            : 'rgba(217,119,6,0.25)'
                    );


                    /*
                     * =================================
                     * 実績
                     * =================================
                     */
                    drawBar(
                        ctx,

                        zeroX,

                        salesY -
                        barHeight / 2,

                        salesX -
                        zeroX,

                        barHeight,

                        index === 0
                            ? '#5e6c4b'
                            : '#d97706'
                    );
                }
            );
        }
    };


    /*
     * ==========================================
     * Chart.js
     * ==========================================
     */
    storeChart =
        new Chart(
            canvas,
            {

                type: 'bar',

                data: {

                    labels: [
                        'Kahala',
                        'Dillingham'
                    ],

                    datasets: [

                        /*
                         * 実際の棒は
                         * カスタム描画するため透明
                         */
                        {
                            label: '計画',

                            data: plans,

                            backgroundColor:
                                'transparent',

                            borderWidth: 0
                        },

                        {
                            label: '実績',

                            data: sales,

                            backgroundColor:
                                'transparent',

                            borderWidth: 0
                        }
                    ]
                },


                options: {

                    indexAxis: 'y',

                    responsive: true,

                    maintainAspectRatio: false,

                    animation: false,

                    /*
                     * Chart.js標準凡例は使用しない
                     */
                    plugins: {

                        legend: {
                            display: false
                        },

                        tooltip: {
                            enabled: false
                        }
                    },


                    /*
                     * マウス操作による
                     * グラフの変化を防止
                     */
                    interaction: {
                        mode: 'nearest',
                        intersect: false
                    },


                    scales: {

                        x: {

                            beginAtZero: true,

                            ticks: {
                                maxRotation: 45,
                                minRotation: 45,
                                callback:
                                    function(value) {

                                        return fmtDollar(
                                            value
                                        );
                                    }
                            }
                        },

                        y: {

                            ticks: {

                                padding: 10
                            }
                        }
                    }
                },

                plugins: [
                    overlapPlugin
                ]
            }
        );


    /*
     * ==========================================
     * マウス移動
     * ==========================================
     */
    canvas.addEventListener(
        'mousemove',
        function(event) {

            const rect =
                canvas.getBoundingClientRect();

            const mouseX =
                event.clientX -
                rect.left;

            const mouseY =
                event.clientY -
                rect.top;


            const xScale =
                storeChart.scales.x;

            const yScale =
                storeChart.scales.y;


            let targetIndex =
                -1;


            storeNames.forEach(
                (storeName, index) => {

                    const centerY =
                        yScale.getPixelForValue(
                            index
                        );


                    /*
                     * 店舗行の範囲
                     */
                    if (
                        mouseY >=
                        centerY - 15 &&

                        mouseY <=
                        centerY + 15
                    ) {

                        const zeroX =
                            xScale.getPixelForValue(
                                0
                            );

                        const planX =
                            xScale.getPixelForValue(
                                plans[index]
                            );

                        const salesX =
                            xScale.getPixelForValue(
                                sales[index]
                            );


                        const maxX =
                            Math.max(
                                planX,
                                salesX
                            );


                        if (
                            mouseX >= zeroX &&
                            mouseX <= maxX
                        ) {

                            targetIndex =
                                index;
                        }
                    }
                }
            );


            /*
             * 棒の外
             */
            if (
                targetIndex === -1
            ) {

                tooltipEl.style.display =
                    'none';

                canvas.style.cursor =
                    'default';

                return;
            }


            /*
             * =================================
             * ツールチップ
             * =================================
             */
            tooltipEl.innerHTML = `

                <div
                    style="
                        font-weight:700;
                        margin-bottom:5px;
                    "
                >
                    ${storeNames[targetIndex]}
                </div>

                <div>
                    計画：
                    ${fmtDollar(
                        plans[targetIndex]
                    )}
                </div>

                <div>
                    実績：
                    ${fmtDollar(
                        sales[targetIndex]
                    )}
                </div>

            `;


            tooltipEl.style.display =
                'block';


            /*
             * カーソルの右下に表示
             */
            let left =
                event.clientX + 15;

            let top =
                event.clientY + 15;


            /*
             * 右端からはみ出す場合
             */
            const tooltipWidth =
                tooltipEl.offsetWidth;

            if (
                left + tooltipWidth >
                window.innerWidth
            ) {

                left =
                    event.clientX -
                    tooltipWidth -
                    15;
            }


            /*
             * 下端からはみ出す場合
             */
            const tooltipHeight =
                tooltipEl.offsetHeight;

            if (
                top + tooltipHeight >
                window.innerHeight
            ) {

                top =
                    event.clientY -
                    tooltipHeight -
                    15;
            }


            tooltipEl.style.left =
                left + 'px';

            tooltipEl.style.top =
                top + 'px';


            canvas.style.cursor =
                'pointer';
        }
    );


    /*
     * ==========================================
     * Canvasからマウスが離れた場合
     * ==========================================
     */
    canvas.addEventListener(
        'mouseleave',
        function() {

            tooltipEl.style.display =
                'none';

            canvas.style.cursor =
                'default';
        }
    );
}

    function updateDashboard(period) {
        currentPeriod = period;
        document.querySelectorAll('.period-btn')
        .forEach(btn => {
            btn.classList.remove('active');
        });
        document.getElementById(
            'btn-' + period
        ).classList.add('active');
        const d = getData(period);
        const ote = d.otemachi;
        const res = d.restaurant;
        const selectedDate =
            new Date(
                document.getElementById('date-picker').value
            );
        const startDate =
            period === 'monthly'
            ? new Date(
                selectedDate.getFullYear(),
                selectedDate.getMonth(),
                1
            )
            : new Date(
                selectedDate.getMonth() >= 9
                    ? selectedDate.getFullYear()
                    : selectedDate.getFullYear() - 1,
                9,
                1
            );
        document.getElementById(
            'display-period'
        ).innerHTML = `
            ${startDate.getFullYear()}年
            ${startDate.getMonth()+1}月
            ${startDate.getDate()}日
            ～
            ${selectedDate.getFullYear()}年
            ${selectedDate.getMonth()+1}月
            ${selectedDate.getDate()}日
        `;
        const notice =
            period === 'monthly'
            ? '※ 計画値は月末計画値です。達成率は月末計画に対する進捗率を表示しています。'
            : '※ 計画値は年間計画値です。達成率は年間計画に対する進捗率を表示しています。';
        document.getElementById(
            'period-notice'
        ).textContent = notice;
        // TOTAL
        const totalSales =
            ote.sales + res.sales;
        currentTotalSales = totalSales;
        const totalPlan =
            ote.plan + res.plan;
        const totalLast =
            ote.last + res.last;
        const totalRate =
            (totalSales / totalPlan) * 100;
        document.getElementById('total-sales').textContent =
            fmtDollar(totalSales);
        document.getElementById('total-plan').textContent =
            fmtDollar(totalPlan);
        document.getElementById('total-rate').textContent =
            totalRate.toFixed(1) + '%';
        updateProgress('total-progress', totalRate);
        renderYoYBadge(
            'total-sales-yoy',
            totalSales,
            totalLast
        );
        updateRateColor(
            'total-rate',
            totalRate
        );
        // Kahala
        const oteRate =
            (ote.sales / ote.plan) * 100;
        document.getElementById('org-sales').textContent =
            fmtDollar(ote.sales);
        document.getElementById('org-plan').textContent =
            fmtDollar(ote.plan);
        document.getElementById('org-rate').textContent =
            oteRate.toFixed(1) + '%';
        updateProgress('org-progress', oteRate);
        renderYoYBadge(
            'org-sales-yoy',
            ote.sales,
            ote.last
        );
        updateRateColor(
            'org-rate',
            oteRate
        );
        // Dillingham
        const resRate =
            (res.sales / res.plan) * 100;
        document.getElementById('res-sales').textContent =
            fmtDollar(res.sales);
        document.getElementById('res-plan').textContent =
            fmtDollar(res.plan);
        document.getElementById('res-rate').textContent =
            resRate.toFixed(1) + '%';
        updateProgress('res-progress', resRate);
        renderYoYBadge(
            'res-sales-yoy',
            res.sales,
            res.last
        );
        renderStoreChart(
            ote.sales,
            res.sales,
            ote.plan,
            res.plan
        );
        updateRateColor(
            'res-rate',
            resRate
        );
        // 店舗別 実績反映日
        document.getElementById("org-last-update").textContent =
            ote.lastUpdate;
        document.getElementById("res-last-update").textContent =
            res.lastUpdate;
        // 店舗合計は、2店舗のうち古い日付を表示
        const totalLastUpdate =
            ote.lastUpdate < res.lastUpdate
                ? ote.lastUpdate
                : res.lastUpdate;
        document.getElementById("last-update").textContent =
            totalLastUpdate;
        document.getElementById("trendButton").textContent =
            currentPeriod === "monthly"
                ? "日別推移"
                : "月別推移";
    }

    function refreshCurrentPeriod() {
        updateDashboard(currentPeriod);
    }

    window.addEventListener('load', () => {
        const today = new Date();
        const yyyy =
            today.getFullYear();
        const mm =
            String(today.getMonth() + 1)
            .padStart(2, '0');
        const dd =
            String(today.getDate())
            .padStart(2, '0');
        document.getElementById(
            'date-picker'
        ).value =
            `${yyyy}-${mm}-${dd}`;
        updateDashboard('monthly');
    });

    function openTrendModal(type) {
        if(type === 'kahala'){
            currentTrendSales = 
                Number(
                    document
                    .getElementById('org-sales')
                    .textContent
                    .replace(/[$,]/g,'')
                );
            currentTrendPlan =
                Number(
                    document
                    .getElementById('org-plan')
                    .textContent
                    .replace(/[$,]/g,'')
                );
            currentTrendTitle =
                currentPeriod === "monthly"
                    ? "Kahala 日別売上推移"
                    : "Kahala 月別売上推移";
        }
        if(type === 'dillingham'){
            currentTrendSales =
                Number(
                    document
                    .getElementById('res-sales')
                    .textContent
                    .replace(/[$,]/g,'')
                );
            currentTrendPlan =
                Number(
                    document
                    .getElementById('res-plan')
                    .textContent
                    .replace(/[$,]/g,'')
                );
            currentTrendTitle =
                currentPeriod === "monthly"
                    ? "Dillingham 日別売上推移"
                    : "Dillingham 月別売上推移";
        }
        if(type === 'total'){
            currentTrendSales = currentTotalSales;
            currentTrendPlan =
                Number(
                    document
                    .getElementById('total-plan')
                    .textContent
                    .replace(/[$,]/g,'')
                );
            currentTrendTitle =
                currentPeriod === "monthly"
                    ? "店舗合計 日別売上推移"
                    : "店舗合計 月別売上推移";
        }
        document
            .getElementById("trendModal")
            .classList.remove("hidden");
        setTimeout(()=>{
            renderTrendChart();
        },100);
    }

    function closeTrendModal() {
        document
            .getElementById("trendModal")
            .classList.add("hidden");
    }

    function renderTrendChart() {

    const canvas =
        document.getElementById("trendChart");

    if (trendChart) {
        trendChart.destroy();
    }

    let labels = [];
    let data = [];
    let planData = [];

    /*
     * ==========================================
     * 日別
     * ==========================================
     */
    if (currentPeriod === "monthly") {

        document.getElementById("trendTitle").textContent =
            currentTrendTitle;

        let tempData = [];
        let tempPlanData = [];

        for (let i = 1; i <= 31; i++) {

            labels.push(i + "日");

            // 実績
            tempData.push(
                randomRangeDecimal(50, 300)
            );

            // 計画
            tempPlanData.push(
                randomRangeDecimal(80, 280)
            );
        }

        const tempTotal =
            tempData.reduce(
                (a, b) => a + b,
                0
            );

        const tempPlanTotal =
            tempPlanData.reduce(
                (a, b) => a + b,
                0
            );

        data =
            tempData.map(value =>
                Number(
                    (
                        value /
                        tempTotal *
                        currentTrendSales
                    ).toFixed(2)
                )
            );

        planData =
            tempPlanData.map(value =>
                Number(
                    (
                        value /
                        tempPlanTotal *
                        currentTrendPlan
                    ).toFixed(2)
                )
            );
    }

    /*
     * ==========================================
     * 年間
     * ==========================================
     */
    else {

        document.getElementById("trendTitle").textContent =
            currentTrendTitle;

        const months = [
            "10月", "11月", "12月",
            "1月", "2月", "3月",
            "4月", "5月", "6月",
            "7月", "8月", "9月"
        ];

        labels = months;

        let tempData = [];
        let tempPlanData = [];

        months.forEach(() => {

            tempData.push(
                randomRangeDecimal(3000, 6000)
            );

            tempPlanData.push(
                randomRangeDecimal(3000, 6000)
            );
        });

        const tempTotal =
            tempData.reduce(
                (a, b) => a + b,
                0
            );

        const tempPlanTotal =
            tempPlanData.reduce(
                (a, b) => a + b,
                0
            );

        data =
            tempData.map(value =>
                Number(
                    (
                        value /
                        tempTotal *
                        currentTrendSales
                    ).toFixed(2)
                )
            );

        planData =
            tempPlanData.map(value =>
                Number(
                    (
                        value /
                        tempPlanTotal *
                        currentTrendPlan
                    ).toFixed(2)
                )
            );
    }

    /*
     * ==========================================
     * 合計表示
     * ==========================================
     */

    document.getElementById("trendTotalSales").textContent =
        fmtDollar(currentTrendSales);

    document.getElementById("trendTotalPlan").textContent =
        fmtDollar(currentTrendPlan);


/*
 * ==========================================
 * カスタム描画
 * ==========================================
 */

const trendOverlapPlugin = {

    id: "trendOverlapPlugin",

    afterDatasetsDraw(chart) {

        const ctx = chart.ctx;
        const xScale = chart.scales.x;
        const yScale = chart.scales.y;

        /*
         * 日と日の中心間距離を取得
         */
        let step = 0;

        if (labels.length > 1) {
            step =
                Math.abs(
                    xScale.getPixelForValue(1) -
                    xScale.getPixelForValue(0)
                );
        }

        /*
         * 1日分の領域の50%程度を棒に使用
         *
         * これ以上広げると隣の日と重なるため、
         * stepを基準にして幅を決定する
         */
        const barWidth =
            Math.min(
                24,
                step * 0.45
            );

        /*
         * 計画と実績を50%重ねる
         */
        const overlap =
            barWidth * 0.5;

        const radius = 5;

        for (let i = 0; i < labels.length; i++) {

            /*
             * 各日の中心
             */
            const centerX =
                xScale.getPixelForValue(i);

            /*
             * 0位置
             */
            const zeroY =
                yScale.getPixelForValue(0);


            /*
             * ==================================
             * 計画
             * ==================================
             */

            const planY =
                yScale.getPixelForValue(
                    planData[i]
                );

            const planLeft =
                centerX -
                barWidth / 2;

            const planRight =
                centerX +
                barWidth / 2;

            ctx.save();

            ctx.fillStyle =
                "rgba(111, 160, 232, 0.25)";

            ctx.strokeStyle =
                "#6fa0e8";

            ctx.lineWidth = 1;

            ctx.beginPath();

            ctx.moveTo(
                planLeft,
                zeroY
            );

            ctx.lineTo(
                planLeft,
                planY + radius
            );

            ctx.quadraticCurveTo(
                planLeft,
                planY,
                planLeft + radius,
                planY
            );

            ctx.lineTo(
                planRight - radius,
                planY
            );

            ctx.quadraticCurveTo(
                planRight,
                planY,
                planRight,
                planY + radius
            );

            ctx.lineTo(
                planRight,
                zeroY
            );

            ctx.closePath();

            ctx.fill();
            ctx.stroke();

            ctx.restore();


            /*
             * ==================================
             * 実績
             * ==================================
             */

            const salesY =
                yScale.getPixelForValue(
                    data[i]
                );

            /*
             * 実績だけ右へ50%分ずらす
             */
            const salesLeft =
                centerX -
                barWidth / 2 +
                overlap;

            const salesRight =
                salesLeft +
                barWidth;

            ctx.save();

            ctx.fillStyle =
                "#6fa0e8";

            ctx.beginPath();

            ctx.moveTo(
                salesLeft,
                zeroY
            );

            ctx.lineTo(
                salesLeft,
                salesY + radius
            );

            ctx.quadraticCurveTo(
                salesLeft,
                salesY,
                salesLeft + radius,
                salesY
            );

            ctx.lineTo(
                salesRight - radius,
                salesY
            );

            ctx.quadraticCurveTo(
                salesRight,
                salesY,
                salesRight,
                salesY + radius
            );

            ctx.lineTo(
                salesRight,
                zeroY
            );

            ctx.closePath();

            ctx.fill();

            ctx.restore();
        }
    }
};


    /*
     * ==========================================
     * Chart.js
     * ==========================================
     */

    trendChart = new Chart(
        canvas,
        {
            type: "bar",

            data: {

                labels: labels,

                datasets: [

                    /*
                     * カスタム描画用
                     *
                     * 実際の棒は透明にする
                     */
                    {
                        label: "計画",
                        data: planData,
                        backgroundColor:
                            "rgba(0,0,0,0)",
                        borderWidth: 0
                    },

                    {
                        label: "実績",
                        data: data,
                        backgroundColor:
                            "rgba(0,0,0,0)",
                        borderWidth: 0
                    }
                ]
            },

            plugins: [
                trendOverlapPlugin
            ],

            options: {

                responsive: true,

                maintainAspectRatio: false,

                animation: false,

                plugins: {

                    legend: {
    display: true,
    position: "top",

    labels: {
        usePointStyle: false,

        generateLabels: function(chart) {

            return [
                {
                    text: "計画",

                    fillStyle:
                        "rgba(111, 160, 232, 0.25)",

                    strokeStyle:
                        "#6fa0e8",

                    lineWidth: 1,

                    hidden: false,

                    datasetIndex: 0
                },
                {
                    text: "実績",

                    fillStyle:
                        "#6fa0e8",

                    strokeStyle:
                        "#6fa0e8",

                    lineWidth: 1,

                    hidden: false,

                    datasetIndex: 1
                }
            ];
        }
    }
}
                },

                interaction: {

                    mode: "index",

                    intersect: false
                },

                scales: {

                    x: {

                        ticks: {

                            maxRotation: 45,
                            minRotation: 45
                        }
                    },

                    y: {

                        beginAtZero: true,

                        ticks: {

                            callback: function(value) {

                                return fmtDollar(value);
                            }
                        }
                    }
                }
            }
        }
    );
}
</script>
