<!DOCTYPE html>
<html lang="ja">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AKUSHU CAFE | Executive Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>

        body {
            font-family: 'Inter', 'Shippori Mincho', serif;
            background-color: #fcfbf9;
            color: #4a4a4a;
        }

        .card-header-org {
            background-color: #5e6c4b;
        }

        .card-header-res {
            background-color: #b45309;
        }

        .glass-panel {
            background: rgba(255,255,255,0.95);
            border: 1px solid rgba(139,94,60,0.15);
            box-shadow: 0 4px 15px -1px rgba(139,94,60,0.05);
            backdrop-filter: blur(8px);
        }

        .font-jp {
            font-family: 'Shippori Mincho', serif;
        }

        .period-btn {
            transition: all 0.3s ease;
        }

        .period-btn.active {
            background-color: #57534e;
            color: white;
        }

        .period-btn:not(.active):hover {
            background-color: #e7e5e4;
            color: #57534e;
        }

        .store-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.08);
            border: 1px solid #f3f4f6;
        }

        .store-header {
            padding: 16px 20px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .plan-box {
            background: #fafaf9;
            border: 1px solid #e7e5e4;
            border-radius: 10px;
            padding: 16px;
        }

        .progress-wrap {
            width: 100%;
            height: 18px;
            background: #e7e5e4;
            border-radius: 9999px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            border-radius: 9999px;
            transition: width .5s ease;
        }

        .progress-green {
            background: linear-gradient(to right, #10b981, #34d399);
        }

        .progress-orange {
            background: linear-gradient(to right, #f59e0b, #fbbf24);
        }

        .progress-blue {
            background: linear-gradient(to right, #3b82f6, #60a5fa);
        }

        .chart-area {
            height: 180px;
        }

        .yoy-label {
            font-size: 14px;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 9999px;
            display: inline-block;
        }

        .yoy-up {
            background: #dcfce7;
            color: #166534;
        }

        .yoy-down {
            background: #fee2e2;
            color: #991b1b;
        }

    </style>

</head>

<body class="bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] flex flex-col min-h-screen">

<header class="bg-white/80 backdrop-blur-md border-b border-stone-200 sticky top-0 z-50">

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

        <div class="flex justify-between h-20 items-center">

            <div class="flex items-center gap-3">

                <div class="w-10 h-10 bg-stone-700 rounded-lg flex items-center justify-center text-white shadow-md font-jp font-bold text-2xl">
                    A
                </div>

                <div>

                    <h1 class="text-2xl font-jp font-bold tracking-widest text-stone-700">
                        握手カフェ
                    </h1>

                    <p class="text-[10px] text-stone-500 uppercase tracking-widest font-sans">
                        Sales Performance Dashboard
                    </p>

                </div>

            </div>

            <div class="flex items-center gap-4">

                <div class="flex bg-[#f5f5f4] p-1 rounded-lg border border-stone-200">

                    <button onclick="updateDashboard('monthly')"
                            id="btn-monthly"
                            class="period-btn active px-6 py-1.5 text-xs font-bold rounded-md">
                        月次
                    </button>

                    <button onclick="updateDashboard('yearly')"
                            id="btn-yearly"
                            class="period-btn px-6 py-1.5 text-xs font-bold rounded-md text-stone-600">
                        年次
                    </button>

                </div>

                <input type="date"
                       id="date-picker"
                       class="border border-stone-300 rounded-lg px-3 py-2 text-sm"
                       onchange="refreshCurrentPeriod()">

            </div>

        </div>

    </div>

</header>

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8 flex-grow">

    <!-- TOTAL -->
    <section>

        <div class="flex items-center justify-between mb-4">

            <div class="flex items-center gap-2">

                <span class="w-1 h-6 bg-stone-600"></span>

                <h2 class="text-xl font-jp font-bold text-stone-700">
                    店舗合計
                </h2>

            </div>

            <div id="display-period"
                 class="text-sm text-gray-500 font-bold">
            </div>

        </div>

        <div class="glass-panel p-8 rounded-xl border-t-4 border-stone-500">

            <div class="text-center mb-8">

                <div class="text-xs text-gray-500 font-bold uppercase mb-2">
                    合計売上（税別）
                </div>

                <div class="text-5xl font-bold text-gray-800 tracking-tight mb-3"
                     id="total-sales">
                    ¥0
                </div>

                <div id="total-sales-yoy"
                     class="flex justify-center">
                </div>

            </div>

            <div class="plan-box max-w-3xl mx-auto">

                <div class="grid grid-cols-2 gap-4 text-center mb-4">

                    <div>

                        <div class="text-[11px] text-gray-400 mb-1">
                            計画値（税別）
                        </div>

                        <div class="text-3xl font-bold text-stone-700"
                             id="total-plan">
                            ¥0
                        </div>

                    </div>

                    <div class="border-l border-gray-200">

                        <div class="text-[11px] text-gray-400 mb-1">
                            達成率
                        </div>

                        <div class="text-3xl font-bold text-emerald-600"
                             id="total-rate">
                            0%
                        </div>

                    </div>

                </div>

                <div class="progress-wrap">

                    <div id="total-progress"
                         class="progress-bar progress-green"
                         style="width:0%;">
                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- 横棒グラフ -->
    <section class="glass-panel p-6 rounded-xl">

        <div class="flex items-center gap-2 mb-4">

            <span class="w-1 h-6 bg-stone-600"></span>

            <h2 class="text-lg font-jp font-bold text-stone-700">
                店舗別売上比較（税別）
            </h2>

        </div>

        <div class="chart-area">
            <canvas id="storeChart"></canvas>
        </div>

    </section>

    <!-- STORE -->
    <section class="grid grid-cols-1 lg:grid-cols-2 gap-8">

        <!-- 握手大手町 -->
        <div class="store-card">

            <div class="store-header card-header-org">

                <h3 class="text-xl font-jp font-bold">
                    握手大手町
                </h3>

                <span class="text-xs opacity-75">
                    OTEMACHI
                </span>

            </div>

            <div class="p-8">

                <!-- 売上 -->
                <div class="text-center mb-6">

                    <div class="text-xs text-gray-400 mb-1">
                        売上（税別）
                    </div>

                    <div class="text-5xl font-bold text-gray-800 mb-2"
                         id="org-sales">
                        ¥0
                    </div>

                    <div id="org-sales-yoy"
                         class="flex justify-center">
                    </div>

                </div>

                <!-- 計画値 / 達成率 -->
                <div class="plan-box mb-8">

                    <div class="grid grid-cols-2 gap-4 text-center mb-4">

                        <div>

                            <div class="text-[11px] text-gray-400 mb-1">
                                計画値（税別）
                            </div>

                            <div class="text-2xl font-bold text-stone-700"
                                 id="org-plan">
                                ¥0
                            </div>

                        </div>

                        <div class="border-l border-gray-200">

                            <div class="text-[11px] text-gray-400 mb-1">
                                達成率
                            </div>

                            <div class="text-2xl font-bold text-emerald-600"
                                 id="org-rate">
                                0%
                            </div>

                        </div>

                    </div>

                    <div class="progress-wrap">

                        <div id="org-progress"
                             class="progress-bar progress-blue"
                             style="width:0%;">
                        </div>

                    </div>

                </div>

                <!-- 内訳 -->
                <div>

                    <div class="font-bold text-stone-700 mb-4">
                        内訳
                    </div>

                    <!-- 1段目 -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">

                        <div class="bg-stone-50 border border-stone-200 rounded-xl p-4">

                            <div class="text-xs text-gray-500 mb-2">
                                握手カフェ
                            </div>

                            <div class="text-2xl font-bold text-stone-700"
                                 id="cafe-sales">
                                ¥0
                            </div>

                        </div>

                        <div class="bg-stone-50 border border-stone-200 rounded-xl p-4">

                            <div class="text-xs text-gray-500 mb-2">
                                RTB
                            </div>

                            <div class="text-2xl font-bold text-stone-700"
                                 id="rtb-sales">
                                ¥0
                            </div>

                        </div>

                        <div class="bg-stone-50 border border-stone-200 rounded-xl p-4">

                            <div class="text-xs text-gray-500 mb-2">
                                その他
                            </div>

                            <div class="text-2xl font-bold text-stone-700"
                                 id="other-sales">
                                ¥0
                            </div>

                        </div>

                    </div>

                    <!-- 2段目 -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

                        <!-- PARTY -->
                        <div class="bg-white border border-stone-200 rounded-xl overflow-hidden shadow-sm">

                            <div class="bg-[#5e6c4b] text-white px-4 py-3 flex justify-between items-center">

                                <div class="font-bold">
                                    パーティー
                                </div>

                                <div class="text-xs opacity-80">
                                    PARTY
                                </div>

                            </div>

                            <div class="p-5">

                                <div class="text-center mb-4">

                                    <div class="text-[11px] text-gray-400 mb-1">
                                        売上（税別）
                                    </div>

                                    <div class="text-3xl font-bold text-stone-700"
                                         id="party-sales">
                                        ¥0
                                    </div>

                                </div>

                                <div class="grid grid-cols-2 gap-4 text-center mb-4">

                                    <div>

                                        <div class="text-[10px] text-gray-400 mb-1">
                                            計画値
                                        </div>

                                        <div class="font-bold text-stone-700"
                                             id="party-plan">
                                            ¥0
                                        </div>

                                    </div>

                                    <div class="border-l border-gray-100">

                                        <div class="text-[10px] text-gray-400 mb-1">
                                            達成率
                                        </div>

                                        <div class="font-bold text-emerald-600"
                                             id="party-rate">
                                            0%
                                        </div>

                                    </div>

                                </div>

                                <div class="progress-wrap">

                                    <div id="party-progress"
                                         class="progress-bar progress-green"
                                         style="width:0%;">
                                    </div>

                                </div>

                            </div>

                        </div>

                        <!-- EPiCLE -->
                        <div class="bg-white border border-stone-200 rounded-xl overflow-hidden shadow-sm">

                            <div class="bg-[#b45309] text-white px-4 py-3 flex justify-between items-center">

                                <div class="font-bold">
                                    EPiCLE
                                </div>

                                <div class="text-xs opacity-80">
                                    EPiCLE
                                </div>

                            </div>

                            <div class="p-5">

                                <div class="text-center mb-4">

                                    <div class="text-[11px] text-gray-400 mb-1">
                                        売上（税別）
                                    </div>

                                    <div class="text-3xl font-bold text-stone-700"
                                         id="epicle-sales">
                                        ¥0
                                    </div>

                                </div>

                                <div class="grid grid-cols-2 gap-4 text-center mb-4">

                                    <div>

                                        <div class="text-[10px] text-gray-400 mb-1">
                                            計画値
                                        </div>

                                        <div class="font-bold text-stone-700"
                                             id="epicle-plan">
                                            ¥0
                                        </div>

                                    </div>

                                    <div class="border-l border-gray-100">

                                        <div class="text-[10px] text-gray-400 mb-1">
                                            達成率
                                        </div>

                                        <div class="font-bold text-emerald-600"
                                             id="epicle-rate">
                                            0%
                                        </div>

                                    </div>

                                </div>

                                <div class="progress-wrap">

                                    <div id="epicle-progress"
                                         class="progress-bar progress-orange"
                                         style="width:0%;">
                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

        <!-- RESTAURANT -->
        <div class="store-card">

            <div class="store-header card-header-res">

                <h3 class="text-xl font-jp font-bold">
                    握手レストラン（宮島）
                </h3>

                <span class="text-xs opacity-75">
                    RESTAURANT
                </span>

            </div>

            <div class="p-8">

                <div class="text-center mb-6">

                    <div class="text-xs text-gray-400 mb-1">
                        売上（税別）
                    </div>

                    <div class="text-5xl font-bold text-gray-800 mb-2"
                         id="res-sales">
                        ¥0
                    </div>

                    <div id="res-sales-yoy"
                         class="flex justify-center">
                    </div>

                </div>

                <div class="plan-box">

                    <div class="grid grid-cols-2 gap-4 text-center mb-4">

                        <div>

                            <div class="text-[11px] text-gray-400 mb-1">
                                計画値（税別）
                            </div>

                            <div class="text-2xl font-bold text-stone-700"
                                 id="res-plan">
                                ¥0
                            </div>

                        </div>

                        <div class="border-l border-gray-200">

                            <div class="text-[11px] text-gray-400 mb-1">
                                達成率
                            </div>

                            <div class="text-2xl font-bold text-emerald-600"
                                 id="res-rate">
                                0%
                            </div>

                        </div>

                    </div>

                    <div class="progress-wrap">

                        <div id="res-progress"
                             class="progress-bar progress-orange"
                             style="width:0%;">
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

</main>

<script>

    Chart.defaults.font.family =
        "'Inter', 'Shippori Mincho', sans-serif";

    let currentPeriod = 'monthly';
    let storeChart = null;

    const fmtYen = num =>
        '¥' + Math.round(num).toLocaleString();

    function randomRange(min, max) {

        return Math.floor(
            Math.random() * (max - min + 1)
        ) + min;

    }

    function getData(period) {

        const yearly = period === 'yearly';

        const cafeSales =
            yearly ? randomRange(3000000, 5000000)
                   : randomRange(30000, 50000);

        const rtbSales =
            yearly ? randomRange(2000000, 4000000)
                   : randomRange(20000, 40000);

        const partyPlan =
            yearly ? randomRange(5000000, 7000000)
                   : randomRange(50000, 70000);

        const partySales =
            partyPlan * (0.75 + Math.random() * 0.35);

        const epiclePlan =
            yearly ? randomRange(4000000, 6000000)
                   : randomRange(40000, 60000);

        const epicleSales =
            epiclePlan * (0.75 + Math.random() * 0.35);

        const otherSales =
            yearly ? randomRange(1000000, 2000000)
                   : randomRange(10000, 20000);

        const oteSales =
            cafeSales +
            rtbSales +
            partySales +
            epicleSales +
            otherSales;

        const otePlan =
            partyPlan + epiclePlan;

        const resPlan =
            yearly ? randomRange(35000000, 50000000)
                   : randomRange(300000, 450000);

        const resSales =
            resPlan * (0.75 + Math.random() * 0.35);

        return {

            otemachi: {

                sales: oteSales,
                plan: otePlan,
                last: oteSales * (0.85 + Math.random() * 0.3),

                breakdown: {

                    cafe: {
                        sales: cafeSales
                    },

                    rtb: {
                        sales: rtbSales
                    },

                    party: {
                        sales: partySales,
                        plan: partyPlan
                    },

                    epicle: {
                        sales: epicleSales,
                        plan: epiclePlan
                    },

                    other: {
                        sales: otherSales
                    }

                }

            },

            restaurant: {
                sales: resSales,
                plan: resPlan,
                last: resSales * (0.85 + Math.random() * 0.3)
            }

        };

    }

    function renderYoYBadge(elId, current, last) {

        const ratio = (current / last) * 100;

        const className =
            ratio >= 100
                ? 'yoy-up'
                : 'yoy-down';

        const label =
            currentPeriod === 'monthly'
                ? '前年同月比'
                : '前年同期比';

        document.getElementById(elId).innerHTML = `
            <span class="yoy-label ${className}">
                ${label} ${ratio.toFixed(1)}%
            </span>
        `;

    }

    function updateProgress(id, rate) {

        document.getElementById(id).style.width =
            Math.min(rate, 100) + '%';

    }

    function renderStoreChart(oteSales, resSales) {

        const ctx =
            document.getElementById('storeChart');

        if (storeChart) {
            storeChart.destroy();
        }

        storeChart = new Chart(ctx, {

            type: 'bar',

            data: {

                labels: [
                    '握手大手町',
                    '握手レストラン（宮島）'
                ],

                datasets: [{

                    data: [
                        oteSales,
                        resSales
                    ],

                    backgroundColor: [
                        '#5e6c4b',
                        '#d97706'
                    ],

                    borderRadius: 8,
                    barThickness: 30

                }]

            },

            options: {

                indexAxis: 'y',

                responsive: true,
                maintainAspectRatio: false,

                plugins: {

                    legend: {
                        display: false
                    }

                },

                scales: {

                    x: {

                        beginAtZero: true,

                        ticks: {

                            callback: value =>
                                '¥' + Number(value).toLocaleString()

                        }

                    }

                }

            }

        });

    }

    function updateDashboard(period) {

        currentPeriod = period;

        const d = getData(period);

        const ote = d.otemachi;
        const res = d.restaurant;

        const date = new Date();

        document.getElementById(
            'display-period'
        ).textContent =
            period === 'monthly'
            ? `${date.getFullYear()}年${date.getMonth()+1}月 月次`
            : `${date.getFullYear()}年 年次`;

        // TOTAL
        const totalSales =
            ote.sales + res.sales;

        const totalPlan =
            ote.plan + res.plan;

        const totalLast =
            ote.last + res.last;

        const totalRate =
            (totalSales / totalPlan) * 100;

        document.getElementById('total-sales').textContent =
            fmtYen(totalSales);

        document.getElementById('total-plan').textContent =
            fmtYen(totalPlan);

        document.getElementById('total-rate').textContent =
            totalRate.toFixed(1) + '%';

        updateProgress('total-progress', totalRate);

        renderYoYBadge(
            'total-sales-yoy',
            totalSales,
            totalLast
        );

        // OTE
        const oteRate =
            (ote.sales / ote.plan) * 100;

        document.getElementById('org-sales').textContent =
            fmtYen(ote.sales);

        document.getElementById('org-plan').textContent =
            fmtYen(ote.plan);

        document.getElementById('org-rate').textContent =
            oteRate.toFixed(1) + '%';

        updateProgress('org-progress', oteRate);

        renderYoYBadge(
            'org-sales-yoy',
            ote.sales,
            ote.last
        );

        // PARTY
        const partyRate =
            (ote.breakdown.party.sales /
             ote.breakdown.party.plan) * 100;

        document.getElementById('party-sales').textContent =
            fmtYen(ote.breakdown.party.sales);

        document.getElementById('party-plan').textContent =
            fmtYen(ote.breakdown.party.plan);

        document.getElementById('party-rate').textContent =
            partyRate.toFixed(1) + '%';

        updateProgress(
            'party-progress',
            partyRate
        );

        // EPiCLE
        const epicleRate =
            (ote.breakdown.epicle.sales /
             ote.breakdown.epicle.plan) * 100;

        document.getElementById('epicle-sales').textContent =
            fmtYen(ote.breakdown.epicle.sales);

        document.getElementById('epicle-plan').textContent =
            fmtYen(ote.breakdown.epicle.plan);

        document.getElementById('epicle-rate').textContent =
            epicleRate.toFixed(1) + '%';

        updateProgress(
            'epicle-progress',
            epicleRate
        );

        // その他
        document.getElementById('cafe-sales').textContent =
            fmtYen(ote.breakdown.cafe.sales);

        document.getElementById('rtb-sales').textContent =
            fmtYen(ote.breakdown.rtb.sales);

        document.getElementById('other-sales').textContent =
            fmtYen(ote.breakdown.other.sales);

        // RESTAURANT
        const resRate =
            (res.sales / res.plan) * 100;

        document.getElementById('res-sales').textContent =
            fmtYen(res.sales);

        document.getElementById('res-plan').textContent =
            fmtYen(res.plan);

        document.getElementById('res-rate').textContent =
            resRate.toFixed(1) + '%';

        updateProgress('res-progress', resRate);

        renderYoYBadge(
            'res-sales-yoy',
            res.sales,
            res.last
        );

        renderStoreChart(
            ote.sales,
            res.sales
        );

    }

    function refreshCurrentPeriod() {

        updateDashboard(currentPeriod);

    }

    window.addEventListener('load', () => {

        const today = new Date();

        const yyyy =
            today.getFullYear();

        const mm =
            String(today.getMonth() + 1)
            .padStart(2, '0');

        const dd =
            String(today.getDate())
            .padStart(2, '0');

        document.getElementById(
            'date-picker'
        ).value =
            `${yyyy}-${mm}-${dd}`;

        updateDashboard('monthly');

    });

</script>

</body>
</html>
